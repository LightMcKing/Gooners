<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gooner Smasher Pure</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #03030f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 22px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
            color: #00ffff;
        }
        #gameCanvas {
            border: 3px solid #00ffff;
            background-color: #010105;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            max-width: 95vw;
            max-height: 72vh;
            border-radius: 12px;
        }
        .instructions {
            margin: 8px 0;
            font-size: 13px;
            color: #88aaee;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>GOONER SMASHER</h1>
    <canvas id="gameCanvas" width="360" height="540"></canvas>
    <div class="instructions">Left Side Drag: Move ship | Right Side Tap: Shoot Lasers<br>Defeat Jassy the Legendary Gooner!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameOver = false;
        let score = 0;
        let speedMultiplier = 1;
        let screenShakeIntensity = 0;

        const player = {
            x: 164, 
            y: 460,
            width: 32,
            height: 32,
            color: "#00ffff"
        };

        const obstacles = [];
        const lasers = [];
        const particles = [];
        const obstacleSpawnRate = 35; 
        let spawnTimer = 0;
        let lastTouchX = null;

        function getCanvasTouchX(touch) {
            const rect = canvas.getBoundingClientRect();
            const clientX = touch.clientX || (touch.touches && touch.touches[0] ? touch.touches[0].clientX : 0);
            return ((clientX - rect.left) / (rect.right - rect.left)) * canvas.width;
        }

        canvas.addEventListener("touchstart", (e) => {
            if (gameOver) {
                resetGame();
                return;
            }
            
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const touchCanvasX = getCanvasTouchX(touch);

                if (touchCanvasX < canvas.width / 2) {
                    lastTouchX = touchCanvasX;
                } else {
                    fireLaser();
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (gameOver) return;
            
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const touchCanvasX = getCanvasTouchX(touch);

                if (touchCanvasX < canvas.width / 2 && lastTouchX !== null) {
                    const deltaX = touchCanvasX - lastTouchX;
                    player.x += deltaX * 1.5;
                    lastTouchX = touchCanvasX;

                    if (player.x < 0) player.x = 0;
                    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            lastTouchX = null;
        });

        function fireLaser() {
            lasers.push({
                x: player.x + 14, 
                y: player.y,
                width: 4,
                height: 16,
                speed: 13,
                color: "#ff00ff"
            });
        }

        function createExplosion(x, y, color, count = 12) {
            screenShakeIntensity = Math.min(screenShakeIntensity + count * 0.4, 15);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.02,
                    color: color
                });
            }
        }

        function drawPolygon(x, y, radius, sides) {
            if (sides < 3) return;
            ctx.beginPath();
            ctx.moveTo(x + radius * Math.cos(0), y + radius * Math.sin(0));
            for (let i = 1; i <= sides; i++) {
                ctx.lineTo(x + radius * Math.cos(i * 2 * Math.PI / sides), y + radius * Math.sin(i * 2 * Math.PI / sides));
            }
            ctx.closePath();
            ctx.fill();
        }

        function spawnObstacle() {
            const roll = Math.random();
            let radius, hp, speedOffset, color, points, sides, name, isFinalBoss = false;

            if (roll < 0.40) {
                radius = 12; hp = 1; speedOffset = 3.8; color = "#ff5555"; points = 1; sides = 3; name = "mass the gay gooner";
            } else if (roll < 0.70) {
                radius = 18; hp = 2; speedOffset = 2.6; color = "#ffaa00"; points = 3; sides = 4; name = "George the secret gooner";
            } else if (roll < 0.88) {
                radius = 24; hp = 3; speedOffset = 2.0; color = "#ffff33"; points = 5; sides = 5; name = "West the og gooner";
            } else if (roll < 0.96) {
                radius = 30; hp = 5; speedOffset = 1.4; color = "#cc33ff"; points = 12; sides = 6; name = "phantom the serial gooner";
            } else if (roll < 0.99) {
                radius = 40; hp = 10; speedOffset = 1.0; color = "#33ff33"; points = 25; sides = 8; name = "Aura farmer the ultimate gooner";
            } else {
                radius = 52; hp = 25; speedOffset = 0.6; color = "#ffffff"; points = 100; sides = 10; name = "Jassy the legendary gooner";
                isFinalBoss = true;
            }

            obstacles.push({
                x: Math.random() * (canvas.width - radius * 2) + radius,
                y: -radius * 2,
                radius: radius,
                maxHp: hp,
                currentHp: hp,
                speed: speedOffset * speedMultiplier,
                color: color,
                points: points,
                sides: sides,
                name: name,
                isFinalBoss: isFinalBoss,
                flashFrames: 0,
                hue: 0
            });
        }

        function resetGame() {
            obstacles.length = 0;
            lasers.length = 0;
            particles.length = 0;
            score = 0;
            speedMultiplier = 1;
            player.x = 164;
            lastTouchX = null;
            gameOver = false;
        }

        function animate() {
            ctx.save();
            if (screenShakeIntensity > 0) {
                const dx = (Math.random() - 0.5) * screenShakeIntensity;
                const dy = (Math.random() - 0.5) * screenShakeIntensity;
                ctx.translate(dx, dy);
                screenShakeIntensity *= 0.9;
                if (screenShakeIntensity < 0.2) screenShakeIntensity = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 15, 0.95)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("SYSTEM CRASHED", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "white";
                ctx.font = "18px sans-serif";
                ctx.fillText(`Gooners Smashed: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#00ffff";
                ctx.font = "14px sans-serif";
                ctx.fillText("TAP SCREEN TO DEPLOY NEW HULL", canvas.width / 2, canvas.height / 2 + 75);
                ctx.restore();
                requestAnimationFrame(animate);
                return;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.y -= l.speed;
                ctx.fillStyle = l.color;
                ctx.fillRect(l.x, l.y, l.width, l.height);
                if (l.y < -20) lasers.splice(i, 1);
            }

            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + 16, player.y);
            ctx.lineTo(player.x, player.y + 32);
            ctx.lineTo(player.x + 32, player.y + 32);
            ctx.closePath();
            ctx.fill();

            spawnTimer++;
